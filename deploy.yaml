deploy:
  enabled: false
  env:
    # Postgres host. I use Supabase for database.
    - secretKey: "POSTGRES_HOST"
      remoteRef: "SUPABASE_POSTGRES_HOST"
    # Postgres user
    - secretKey: "POSTGRES_USER"
      remoteRef: "SUPABASE_POSTGRES_USER"
    # Postgres password
    - secretKey: "POSTGRES_PASSWORD"
      remoteRef: "SUPABASE_POSTGRES_PASSWORD"
    # Service key for personal file manager API.
    - secretKey: "FILE_MANAGER_SERVICE_API_KEY"
      remoteRef: "FILE_MANAGER_SERVICE_API_KEY"
    # Service key for BA Analyzer API.
    - secretKey: "BA_ANALYZER_SERVICE_API_KEY"
      remoteRef: "BA_ANALYZER_SERVICE_API_KEY"
