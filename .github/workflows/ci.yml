name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Follow the module's go directive so the two never drift apart.
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
