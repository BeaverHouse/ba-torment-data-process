version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/postgres/sql/query"
    schema: "internal/db/postgres/sql/schema"
    gen:
      go:
        package: "postgres"
        sql_package: "pgx/v5"
        out: "internal/db/postgres"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - column: "batorment_v3.youtube_analysis.analysis_result"
            go_type:
              import: "ba-torment-data-process/internal/types"
              package: "types"
              type: "YoutubeAnalysisResult"
